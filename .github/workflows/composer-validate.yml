name: Composer Validate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Dependency Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Validate dependencies and package boundaries
        run: composer validate:deps

      - name: Validate package composer files
        run: composer validate:packages

      - name: Install and verify lock consistency
        run: composer install --prefer-dist --no-interaction
