name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Run tests
        run: composer test

  compatibility:
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '11.*'
            testbench: '^9.0'
            php: '8.3'
          - laravel: '11.*'
            testbench: '^9.0'
            php: '8.4'
          - laravel: '12.*'
            testbench: '^10.0'
            php: '8.3'
          - laravel: '12.*'
            testbench: '^10.0'
            php: '8.4'
          - laravel: '13.*'
            testbench: '^11.0'
            php: '8.4'
          - laravel: '13.*'
            testbench: '^11.0'
            php: '8.5'
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer require \
            "illuminate/contracts:${{ matrix.laravel }}" \
            "illuminate/support:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}" \
            --no-update
          composer update --prefer-dist --no-interaction

      - name: Run Laravel package tests
        run: vendor/bin/phpunit --testsuite Laravel
